<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo simulator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sun-typeface/suit@2.0.5/fonts/static/woff2/SUIT.css">
<style>
:root{--bg:#F4F4F7;--card:#FFFFFF;--ink:#494949;--muted:#7A7A80;--sec:#9C9C9C;--line:#E2E2E8;--green:#64B086;--dk:#2F7A52;--light:#DCEAE2;--red:#E64242;--redsoft:rgba(230,66,66,.12)}
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
body{font-family:SUIT,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.w{background:var(--bg);border-radius:24px;padding:28px 28px 22px;display:grid;gap:20px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dk)}
h2{font-size:22px;font-weight:700;margin-top:6px;line-height:1.3}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;background:var(--card);border-radius:18px;padding:18px 20px}
.ctl{display:grid;gap:8px;min-width:0}
.ctl .lab{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.ctl .lab output{font-variant-numeric:tabular-nums;color:var(--dk)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
input[type=range]{width:100%;accent-color:var(--green)}
.sw{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer;user-select:none}
.sw input{appearance:none;width:40px;height:24px;border-radius:12px;background:#D2D2D6;position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--green)}.sw input:checked::after{left:19px}
.sw small{display:block;font-weight:400;color:var(--muted);font-size:12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:640px){.controls{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.w{padding:20px 16px}}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.25}
.tile.bad .v{color:var(--red)}
.chart{background:var(--card);border-radius:18px;padding:12px 8px 4px}
svg{display:block;width:100%;height:auto}
.ax{fill:var(--sec);font-size:12px}
.take{font-size:15px;line-height:1.5}
.take b{font-weight:700}
.note{font-size:12px;color:var(--sec);line-height:1.5}
</style></head><body>
<div class="w">
  <div><div class="eyebrow">Feed simulator · try it</div><h2>Will this echo come home?</h2></div>
  <div class="controls">
    <div class="ctl"><div class="lab"><span>Readers per day</span></div>
      <div class="seg" id="dau"><button data-v="20" aria-pressed="true">20</button><button data-v="50">50</button><button data-v="100">100</button><button data-v="500">500</button></div></div>
    <div class="ctl"><div class="lab"><label for="t">Deliveries the writer picks</label><output id="tv">20 times</output></div>
      <input id="t" type="range" min="5" max="50" step="5" value="20"></div>
    <label class="sw"><input type="checkbox" id="bump" checked><span>Resurface older echoes<small>1 in 8 feed slots</small></span></label>
    <label class="sw"><input type="checkbox" id="lim" checked><span>Return after 7 days<small>even if short of target</small></span></label>
  </div>
  <div class="tiles">
    <div class="tile"><span class="k">Reached its target</span><span class="v" id="r1">–</span></div>
    <div class="tile"><span class="k">Typical wait</span><span class="v" id="r2">–</span></div>
    <div class="tile" id="t3"><span class="k" id="k3">Came back after 7 days</span><span class="v" id="r3">–</span></div>
    <div class="tile"><span class="k">People it reached</span><span class="v" id="r4">–</span></div>
  </div>
  <div class="chart"><svg id="c" viewBox="0 0 760 300" role="img" aria-label="Typical wait by deliveries picked"></svg></div>
  <p class="take" id="take"></p>
  <p class="note">Simulation with assumed usage: 2 visits per person a day, 8 posts seen per visit, 0.3 posts written per person a day. Not measured data.</p>
</div>

function draw(rows){

  const top=st.lim?T:T+18;
  const X=t=>L+(t-5)/45*(W-L-R), Y=h=>H-B-(Math.log10(Math.max(h,0.1))-lo)/(hi-lo)*(H-B-top);
  let g='';
  [[0.1,'6 min'],[1,'1 h'],[6,'6 h'],[24,'1 day'],[72,'3 days']].forEach(([h,l])=>{const y=Y(h);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#E2E2E8"/><text class="ax" x="${L-10}" y="${y+4}" text-anchor="end">${l}</text>`;});

function render(){
  const rows=data(), r=rows.find(x=>x.T===st.t);

  const stuck=r.reach<0.5;
  $('r2').textContent=stuck?(st.lim?'7 days':'Never'):fmt(r.med);
  $('k3').textContent=st.lim?'Came back after 7 days':'Never came back';

  $('t3').classList.toggle('bad',r.forced>0.05);
  $('r4').textContent='~'+r.uniq+' people';

  else if(st.lim) s=`With ${st.dau} readers a day, <b>${st.t} deliveries</b> is more than the feed can give. <b>${pct(r.forced)}</b> of these echoes come home after 7 days instead of getting stuck.`;

  $('take').innerHTML=s; draw(rows);
}
$('dau').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;$('dau').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));st.dau=+b.dataset.v;render();});
$('t').addEventListener('input',e=>{st.t=+e.target.value;render();});
$('bump').addEventListener('change',e=>{st.bump=e.target.checked;render();});
$('lim').addEventListener('change',e=>{st.lim=e.target.checked;render();});
render();
</script></body></html>
